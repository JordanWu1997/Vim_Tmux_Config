pdf-engine: xelatex

variables:
  documentclass: article
  classoption:
    - 11pt
  papersize: a4
  geometry:
    - left=2.75cm
    - right=2.75cm
    - top=2.70cm
    - bottom=2.05cm
  mainfont: "Noto Sans CJK TC"
  sansfont: "Noto Sans CJK TC"
  monofont: "Noto Sans Mono CJK TC"
  CJKmainfont: "Noto Sans CJK TC"
  linestretch: 1.08
  header-includes: |
    \usepackage{titlesec}
    \usepackage{fancyhdr}
    \usepackage{booktabs}
    \usepackage{array}
    \usepackage{longtable}
    \usepackage{enumitem}
    \usepackage{xcolor}

    % ---- 段落與表格 ----
    \setlength{\parindent}{0pt}
    \setlength{\parskip}{0.48em}
    \setlength{\tabcolsep}{8pt}
    \renewcommand{\arraystretch}{1.26}

    % ---- 清單巢狀深度（預設上限 4 層，提高到 9 層）----
    % \setlistdepth 與 \renewlist 必須排在 \setlist 之前
    \setlistdepth{9}
    \renewlist{itemize}{itemize}{9}
    \renewlist{enumerate}{enumerate}{9}

    \setlist[itemize]{topsep=4pt,itemsep=1.5pt,parsep=0pt,leftmargin=2.2em}
    \setlist[enumerate]{topsep=4pt,itemsep=1.5pt,parsep=0pt,leftmargin=2.2em}

    % \renewlist 會清掉各層預設符號，每層都必須自行指定 label
    \setlist[itemize,1]{label=$\bullet$}
    \setlist[itemize,2]{label=$\circ$}
    \setlist[itemize,3]{label=$-$}
    \setlist[itemize,4]{label=$\cdot$}
    \setlist[itemize,5]{label=$\ast$}
    \setlist[itemize,6]{label=$\diamond$}
    \setlist[itemize,7]{label=$\bullet$}
    \setlist[itemize,8]{label=$\circ$}
    \setlist[itemize,9]{label=$-$}
    \setlist[enumerate,1]{label=\arabic*.}
    \setlist[enumerate,2]{label=(\alph*)}
    \setlist[enumerate,3]{label=\roman*.}
    \setlist[enumerate,4]{label=\Alph*.}
    \setlist[enumerate,5]{label=\arabic*.}
    \setlist[enumerate,6]{label=(\alph*)}
    \setlist[enumerate,7]{label=\roman*.}
    \setlist[enumerate,8]{label=\Alph*.}
    \setlist[enumerate,9]{label=\arabic*.}

    % ---- 標題樣式 ----
    \titleformat{\section}{\bfseries\fontsize{16}{19}\selectfont}{}{0pt}{}
    \titleformat{\subsection}{\bfseries\fontsize{12.5}{15}\selectfont}{}{0pt}{}
    \titleformat{\subsubsection}{\bfseries\fontsize{11.5}{14}\selectfont}{}{0pt}{}
    \titleformat{\paragraph}[runin]{\bfseries\fontsize{11}{13}\selectfont}{}{0pt}{}
    \titlespacing*{\section}{0pt}{13pt}{8pt}
    \titlespacing*{\subsection}{0pt}{10pt}{6pt}
    \titlespacing*{\subsubsection}{0pt}{9pt}{5pt}
    \titlespacing*{\paragraph}{0pt}{8pt}{0.6em}

    % ---- 頁首頁尾 ----
    \pagestyle{fancy}
    \fancyhf{}
    \cfoot{\fontsize{9}{11}\selectfont\thepage}
    \renewcommand{\headrulewidth}{0pt}
    \renewcommand{\footrulewidth}{0pt}
    \setlength{\footskip}{1.05cm}

    % ---- PDF 語言標記（lang 已被覆蓋，此處補回無障礙用 metadata）----
    \AtBeginDocument{\hypersetup{pdflang={zh-TW}}}
